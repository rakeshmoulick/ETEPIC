;
;@file input.ini
;@brief PIC-PBC input file
;
;


[file]
output = data/

[constants]
EPS = 8.85418782E-12		; Absolute permittivity
K = 1.38065E-23				; Boltzmann constant
eV = 1.602176565E-19		; eV
e = 1.602176565E-19			; Electronic charge
AMU = 1.660538921E-27		; Atomic Mass unit
EV_TO_K = 11604.52			; Conversion factor from eV to Kelvin
pi = 3.14159265359			; PI

[time]
;Total Time steps
NUM_TS = 500000		        
;Time Step        
DT_Coeff = 0.01			     

[diagnostics]
;Time interval for writing data
write_interval = 50		

[grid]
; Number of Cells
NC       = 512				

[population]
;Number of electrons loaded into the domain      
nParticlesE = 150000		
;Number of ions loaded into the domain
nParticlesI = 150000		
;Temperature of cold electron species
tempEcold = 20.0			
;Temperature of hot electron species
tempEhot  = 100.0			
;Temperature of ion species
tempI = 1.0				    
;Equilibrium Plasma density
density = 1E10				
;Mass of electrons
massE = 9.10938215E-31		
;Mass of ions
massI = 1  				    
;Charge of electrons
chargeE = 1.602176565E-19	
;The fraction of cold electrons
alp = 0.9					

